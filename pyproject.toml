[project]
name = "face-attendance"
version = "0.1.0"
description = "Local face attendance: YOLO-face + MediaPipe + ArcFace + Qdrant + Gradio"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.19",
    "gradio>=6.0",
    "qdrant-client>=1.20,<1.21",
    "numpy>=1.26,<2.0",
    "pillow>=10.0",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "gdown>=6.4.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
